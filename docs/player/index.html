<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>bspguy demo player</title>
<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
	/* The CSS size is the page's, whatever the canvas's pixel size is. Otherwise a canvas made bigger than
	   the screen (GLFW creates it at the window size from the settings) makes a phone's browser widen the
	   page to fit it, the player then sizes the canvas to that page, and it stays too big for the screen. */
	canvas { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
	/* takes the phone keyboard's typing for the player's text fields (see bspguyTextInputState) */
	#textinput {
		position: absolute; left: 0; top: 0; width: 1px; height: 16px; padding: 0; border: 0; margin: 0;
		opacity: 0; color: transparent; background: transparent; caret-color: transparent;
		font-size: 16px; pointer-events: none; z-index: -1;
	}
	#status {
		position: absolute; left: 0; right: 0; top: 45%; text-align: center;
		font: 16px sans-serif; color: #ccc; white-space: pre-line; pointer-events: none;
	}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<input id="textinput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" tabindex="-1">
<div id="status">Loading...</div>
<script>
	// Options (query string):
	//   server=host:port  address shown in the Connect dialog
	//   connect=1         connect to `server` right away instead of showing the Connect dialog. If
	//                     this page has a "token" cookie (from logging in to the hlcoop_web site),
	//                     it's sent in place of the stream password.
	//   password=pw       with connect=1: the stream password (instead of the token cookie)
	//   direct=1          connect to the game server directly instead of through web/serve.py.
	//                     Assets then come from https://host/<path> (the fastdl server, which must
	//                     allow this page's origin with CORS) and the stream from wss://host:port,
	//                     which needs a WebSocket relay in front of the HLTV port.
	//   skip=world,...    turn parts of playback off for measuring, like the Debug window: world, brushes,
	//                     models, sprites, effects, dlights, audio
	//   glcache=0         send every GL call to the browser, without skipping the ones that wouldn't
	//                     change anything (for checking if that causes a rendering problem)
	//   lowmem=MB         for testing: take this much of the memory away, to see what happens when it
	//                     runs out (files are skipped, and the map or demo stops loading)
	//   reserve=MB        for testing: the memory kept free for what isn't checked before it's allocated
	//                     (WEB_MEMORY_RESERVE), to see how much is needed. The Performance window shows
	//                     the least that's been free.
	//   demolimit=MB      for testing: how much of a live stream is kept (16 MB by default). The oldest
	//                     part is dropped past it.
	//   streamdemo=1      for testing: a demo file loads like a live stream, only a little ahead of
	//                     playback, and keeps only its newest demolimit MB, to see what watching a long
	//                     demo live does to memory
	//   opfs=0            keep the asset packs in memory instead of the browser's storage (the origin
	//                     private file system), as browsers without it do, and don't move model
	//                     animations to disk while memory is low
	//   animidle=SECONDS  for testing: while memory is low, model animations that haven't been used for
	//                     this long are moved to disk (10 by default), and read back when they're needed
	//   swapclear=SECONDS for testing: delete the swap files this often, putting the models' animations
	//                     back in memory, as a map change does
	//   texmax=N          model textures bigger than N pixels are halved when uploaded (0 = no limit).
	//                     256 by default on the Raspberry Pi 3's GPU (VideoCore IV), none elsewhere.
	//   stream=url      with direct=1: a WebSocket relay for the stream of `server` (only that
	//                     address), such as wss://host:3000/hltv from the hlcoop_webserver plugin.
	var params = new URLSearchParams(location.search);
	var config = {};
	if (params.get('server'))
		config.server = params.get('server');
	if (params.get('connect'))
		config.connect = params.get('connect');
	if (params.get('password'))
		config.password = params.get('password');
	if (params.get('glcache'))
		config.glcache = params.get('glcache');
	if (params.get('instancing'))
		config.instancing = params.get('instancing');
	if (params.get('skip'))
		config.skip = params.get('skip');
	if (params.get('lowmem'))
		config.lowmem = params.get('lowmem');
	if (params.get('reserve'))
		config.reserve = params.get('reserve');
	if (params.get('demolimit'))
		config.demolimit = params.get('demolimit');
	if (params.get('streamdemo'))
		config.streamdemo = params.get('streamdemo');
	if (params.get('opfs'))
		config.opfs = params.get('opfs');
	if (params.get('animidle'))
		config.animidle = params.get('animidle');
	if (params.get('swapclear'))
		config.swapclear = params.get('swapclear');
	if (params.get('texmax') !== null)
		config.texmax = params.get('texmax');
	// for testing: a demo file to open (demo=URL), where to pause it, how fast to play it (speed=8), and
	// how long to measure the frame times for first (bench=SECONDS)
	// (DemoViewer::updateOpenedFile)
	['time', 'follow', 'cam', 'view', 'speed', 'demo', 'bench'].forEach(function(k) {
		if (params.get(k))
			config[k] = params.get(k);
	});
	// for testing: glcount=SECONDS logs how many of each WebGL call a frame makes, averaged over that
	// many seconds. Each call costs time in the page and again in the browser's GPU process.
	if (params.get('glcount')) {
		var glCounts = {}, glFrames = 0, glPeriod = parseFloat(params.get('glcount')) * 1000;
		[window.WebGLRenderingContext, window.WebGL2RenderingContext].forEach(function(ctx) {
			if (!ctx)
				return;
			Object.getOwnPropertyNames(ctx.prototype).forEach(function(name) {
				var desc = Object.getOwnPropertyDescriptor(ctx.prototype, name);
				if (!desc || typeof desc.value !== 'function' || name === 'constructor')
					return;
				var fn = desc.value;
				ctx.prototype[name] = function() {
					glCounts[name] = (glCounts[name] || 0) + 1;
					var result = fn.apply(this, arguments);
					// WebGL 1's instanced draws and VAOs are extension functions
					if (name === 'getExtension' && result && !result.bspguyCounted) {
						result.bspguyCounted = true;
						for (var key in result) {
							if (typeof result[key] !== 'function')
								continue;
							(function(ext, key, extFn) {
								ext[key] = function() {
									glCounts[key] = (glCounts[key] || 0) + 1;
									return extFn.apply(ext, arguments);
								};
							})(result, key, result[key]);
						}
					}
					return result;
				};
			});
		});
		var glStart = performance.now();
		(function countFrame() {
			glFrames++;
			if (performance.now() - glStart >= glPeriod) {
				var total = 0, list = Object.keys(glCounts).map(function(k) {
					total += glCounts[k];
					return [k, glCounts[k] / glFrames];
				}).sort(function(a, b) { return b[1] - a[1]; });
				console.log('GL calls per frame: ' + (total / glFrames).toFixed(0) + ' (' + list.slice(0, 15)
					.map(function(e) { return e[0] + ' ' + e[1].toFixed(1); }).join(', ') + ')');
				glCounts = {};
				glFrames = 0;
				glStart = performance.now();
			}
			requestAnimationFrame(countFrame);
		})();
	}
	var token = document.cookie.match(/(?:^|; )token=([^;]*)/);
	if (token && token[1] && token[1] !== 'DELETED')
		config.token = decodeURIComponent(token[1]);
	if (params.get('direct') !== '1') {
		// web/serve.py relays the stream and proxies fastdl downloads, avoiding CORS and TLS problems
		var ws = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host;
		config.streamUrl = ws + '/stream/{host}/{port}';
		config.assetUrl = location.origin + '/fastdl/{host}/{path}';
	}
	else if (params.get('stream')) {
		config.streamRelay = params.get('stream');
	}

	// Emscripten's GLFW reads event.keyCode, which follows the keyboard layout, so on AZERTY the movement
	// keys end up scattered (W is bottom-left) and the key in W's place (Z) toggles mouse capture. Desktop
	// GLFW uses physical key positions, so do the same here: rewrite keyCode from event.code for letters
	// and digits before GLFW's listener sees it (this listener is added first). Ctrl/Cmd shortcuts keep
	// the printed letter. The key up reuses whatever its key down sent, or GLFW would see a stuck key.
	var physicalKeys = {};
	function physicalKeyCode(e) {
		var m = /^(?:Key([A-Z])|Digit([0-9]))$/.exec(e.code || '');
		return m ? (m[1] || m[2]).charCodeAt(0) : 0;
	}
	function setKeyCode(e, keyCode) {
		if (keyCode && keyCode !== e.keyCode)
			Object.defineProperty(e, 'keyCode', { get: function() { return keyCode; } });
	}
	window.addEventListener('keydown', function(e) {
		if (!(e.code in physicalKeys))
			physicalKeys[e.code] = (e.ctrlKey || e.metaKey) ? 0 : physicalKeyCode(e);
		setKeyCode(e, physicalKeys[e.code]);
	}, true);
	window.addEventListener('keyup', function(e) {
		setKeyCode(e, physicalKeys[e.code]);
		delete physicalKeys[e.code];
	}, true);
	window.addEventListener('blur', function() { physicalKeys = {}; }, true); // key ups are lost

	// Alt slows movement, so keep Alt+key presses (Alt+S, Alt+D, Alt+Left...) away from the browser's
	// menus and shortcuts, and stop a lone Alt press from focusing the menu bar. The player still sees
	// the keys. AltGr also sets ctrlKey on Windows, and is left alone so it can still type characters.
	window.addEventListener('keydown', function(e) {
		if (e.altKey && !e.ctrlKey && !e.metaKey) e.preventDefault();
	}, true);
	window.addEventListener('keyup', function(e) {
		if (e.key === 'Alt') e.preventDefault();
	});

	// Ctrl+O opens a demo file in the player (DemoViewer::openDemoDialog), not a page in the browser
	window.addEventListener('keydown', function(e) {
		if ((e.ctrlKey || e.metaKey) && e.code === 'KeyO') e.preventDefault();
	}, true);

	// Firefox opens its quick find bar when ' or / is typed (or any character, with "search for text
	// when you start typing" enabled), which takes the keys away from the chat box. So cancel every
	// character press, except in the hidden text field for phone keyboards (textInput), which needs them.
	// GLFW still reads the character from the same event, and Ctrl/Cmd shortcuts are left alone.
	window.addEventListener('keypress', function(e) {
		if (!e.ctrlKey && !e.metaKey && e.target !== textInput) e.preventDefault();
	}, true);

	// Dragging the camera with the right mouse button can end outside the canvas, and releasing it there
	// would open the browser's context menu. The website's live view shows the player in a same-origin
	// iframe, so the drag can also end over the outer page.
	// A context menu opened by the mouse is only allowed in a window that saw the right button pressed
	// over something other than the canvas. A drag that started on the canvas, here or in the iframe,
	// never presses the button in the outer page. This doesn't depend on when the browser sends the event
	// (Firefox on Windows sends it well after the release). Menus opened from the keyboard are left alone.
	// Listeners on the outer page are removed when this page goes away (the player restarting or the
	// live view closing). They belong to this page, so while the outer page kept them, it kept this
	// whole page alive too, with the player's memory, and a 32-bit browser had no room for the next one.
	function blockDragContextMenu(win) {
		var allowNext = false;
		function onMouseDown(e) {
			if (e.button === 2)
				allowNext = !(e.target && e.target.id === 'canvas');
		}
		function onContextMenu(e) {
			var fromMouse = e.button === 2 && !(e.mozInputSource === 6); // 6 = MOZ_SOURCE_KEYBOARD
			if (fromMouse && !allowNext)
				e.preventDefault();
			allowNext = false;
		}
		win.addEventListener('mousedown', onMouseDown, true);
		win.addEventListener('contextmenu', onContextMenu, true);
		if (win !== window) {
			window.addEventListener('pagehide', function() {
				try {
					win.removeEventListener('mousedown', onMouseDown, true);
					win.removeEventListener('contextmenu', onContextMenu, true);
				} catch (e) {}
			});
		}
	}
	blockDragContextMenu(window);
	try {
		if (window.parent !== window)
			blockDragContextMenu(window.parent);
	} catch (e) {} // embedded by another site

	var statusEl = document.getElementById('status');
	var canvas = document.getElementById('canvas');
	canvas.width = window.innerWidth;
	canvas.height = window.innerHeight;

	// Touch screens: the first finger is the mouse. GLFW does this itself, but presses the button at the
	// moment the finger lands, without moving the cursor there first, so ImGui saw the tap where the last
	// one ended. Moving the cursor first isn't enough either: some ImGui items (the settings' tabs) only
	// take a click once the cursor has been over them for a frame. So the touches are kept from GLFW and
	// sent as mouse events: the cursor moves when the finger lands, and the button is pressed at least
	// two frames later. A tap clicks when the finger lifts, and a finger that moves presses the left
	// button where it landed, for dragging (the seek bar, sliders, looking around), except that one
	// moving up or down over the UI scrolls the window under it (bspguyTouchScroll). Holding the finger
	// still for TOUCH_LONG_MS is a right click, which opens the toolbar buttons' menus. Afterwards the
	// cursor moves off the page, or the last thing tapped would keep showing its tooltip.
	var TOUCH_LONG_MS = 500, TOUCH_SLOP = 10; // pixels a finger can move and still be holding still
	var touchId = null, touchX = 0, touchY = 0, touchStartX = 0, touchStartY = 0, touchSeq = 0;
	var touchReady = false; // two frames have passed since the cursor moved there
	var touchWant = -1; // the button the touch is (or will be, once ready) pressing, -1 while undecided
	var TOUCH_SCROLL = 3; // touchWant for a swipe that scrolls
	var touchButton = -1; // the button pressed now
	var touchUp = false, touchTimer = 0;
	var fingerX = 0, fingerY = 0; // where the finger is (touchX and touchY are where the cursor is)
	function sendMouse(type, button) {
		var x = touchX, y = touchY;
		if (type === 'away') {
			type = 'mousemove';
			x = y = -10000;
		}
		canvas.dispatchEvent(new MouseEvent(type, {
			clientX: x, clientY: y, button: button || 0, buttons: type === 'mousedown' ? (button === 2 ? 2 : 1) : 0,
			bubbles: true
		}));
	}
	function afterFrames(n, fn) {
		requestAnimationFrame(function() { n > 1 ? afterFrames(n - 1, fn) : fn(); });
	}
	function touchRelease() {
		if (touchButton < 0)
			return;
		sendMouse('mouseup', touchButton);
		touchButton = -1;
		touchAway();
	}
	// presses the touch's button once it's ready. A right click, or a touch that has already ended, is
	// released a frame later.
	function touchPress() {
		if (!touchReady || touchWant < 0 || touchWant === TOUCH_SCROLL || touchButton >= 0)
			return;
		touchButton = touchWant;
		sendMouse('mousedown', touchButton);
		if (touchUp || touchButton === 2)
			afterFrames(1, touchRelease);
	}
	function touchAway() {
		var seq = touchSeq;
		afterFrames(2, function() {
			if (seq === touchSeq && touchId === null)
				sendMouse('away');
		});
	}
	// moves the cursor, or scrolls, with the finger
	function touchFollow() {
		if (touchWant === TOUCH_SCROLL) {
			if (window.bspguyTouchScroll)
				window.bspguyTouchScroll(fingerY - touchY);
			touchY = fingerY;
		}
		else if (touchButton === 0) {
			touchX = fingerX;
			touchY = fingerY;
			sendMouse('mousemove');
		}
	}
	// Once the finger has moved, decides if it scrolls or drags. It's only decided once the player has
	// had a frame with the cursor there, which says if that's over the UI (bspguyOverUi).
	function touchDecide() {
		var dx = Math.abs(fingerX - touchStartX), dy = Math.abs(fingerY - touchStartY);
		if (!touchReady || touchWant >= 0 || (dx <= TOUCH_SLOP && dy <= TOUCH_SLOP))
			return;
		clearTimeout(touchTimer);
		touchWant = dy > dx && window.bspguyOverUi ? TOUCH_SCROLL : 0; // a drag presses where the finger landed
		touchPress();
		touchFollow();
		if (touchId === null && touchWant === TOUCH_SCROLL)
			touchAway(); // lifted already
	}
	function findTouch(list) {
		for (var i = 0; i < list.length; i++) {
			if (list[i].identifier === touchId)
				return list[i];
		}
		return null;
	}
	window.addEventListener('touchstart', function(e) {
		if (e.target !== canvas)
			return;
		e.stopPropagation();
		e.preventDefault(); // no mouse events of the browser's own, scrolling or zooming
		if (touchId !== null || touchButton >= 0 || (touchUp && !touchReady))
			return; // another finger, or the last touch's click isn't done yet
		var t = e.changedTouches[0];
		var seq = ++touchSeq;
		touchId = t.identifier;
		touchX = touchStartX = fingerX = t.clientX;
		touchY = touchStartY = fingerY = t.clientY;
		touchReady = false;
		touchWant = -1;
		touchUp = false;
		sendMouse('mousemove');
		afterFrames(2, function() {
			if (seq !== touchSeq)
				return;
			touchReady = true;
			touchDecide();
			touchPress();
		});
		clearTimeout(touchTimer);
		touchTimer = setTimeout(function() {
			if (seq === touchSeq && touchId !== null && touchWant < 0) {
				touchWant = 2;
				touchPress();
			}
		}, TOUCH_LONG_MS);
	}, { capture: true, passive: false });
	window.addEventListener('touchmove', function(e) {
		if (e.target !== canvas)
			return;
		e.stopPropagation();
		e.preventDefault();
		var t = findTouch(e.changedTouches);
		if (!t || touchWant === 2)
			return;
		fingerX = t.clientX;
		fingerY = t.clientY;
		if (touchWant < 0)
			touchDecide();
		else
			touchFollow();
	}, { capture: true, passive: false });
	function onTouchEnd(e) {
		if (e.target !== canvas)
			return;
		e.stopPropagation();
		e.preventDefault();
		if (!findTouch(e.changedTouches))
			return;
		touchId = null;
		touchUp = true;
		clearTimeout(touchTimer);
		var moved = Math.abs(fingerX - touchStartX) > TOUCH_SLOP || Math.abs(fingerY - touchStartY) > TOUCH_SLOP;
		if (touchWant < 0) {
			if (!moved || touchReady) {
				touchWant = 0; // a tap
				touchPress();
			} // else a quick swipe, which is decided once the player is ready
		}
		else if (touchButton === 0)
			touchRelease();
		else if (touchButton < 0 && (touchWant === 2 || touchWant === TOUCH_SCROLL))
			touchAway(); // the right click or scroll is done
	}
	window.addEventListener('touchend', onTouchEnd, { capture: true, passive: false });
	window.addEventListener('touchcancel', onTouchEnd, { capture: true, passive: false });

	// A phone only shows its keyboard for a focused text field in the page, and only if it was focused
	// during a tap. So this hidden one is focused when a tap ends over a text field in the player (the
	// player shows the text cursor there by then), is moved to where the field's text cursor is, so the
	// browser keeps it in view above the keyboard, and what's typed in it is sent on to the player
	// (DemoGui::updateWebTextInput). Typing changes its value in ways key events don't show (Android
	// keyboards send keyCode 229 and replace whole words as they correct them), so the value is compared
	// with what was sent: what changed at the end is sent as backspaces and new text. It starts with
	// spaces so a backspace always has something to delete. Keys that aren't characters (Enter, a real
	// Backspace key, which GLFW cancels in the field) still go to the player through GLFW.
	var textInput = document.getElementById('textinput');
	var TEXT_INPUT_BASE = '  ';
	var textSent = '', textComposing = false, textWanted = false, textHover = false;
	function resetTextInput() {
		textInput.value = TEXT_INPUT_BASE;
		textSent = TEXT_INPUT_BASE;
	}
	function sendTextInput() {
		var v = textInput.value, i = 0;
		while (i < v.length && i < textSent.length && v[i] === textSent[i])
			i++;
		var c = i > 0 ? v.charCodeAt(i - 1) : 0;
		if (c >= 0xD800 && c <= 0xDBFF)
			i--; // don't split a character made of two UTF-16 units
		var removed = Array.from(textSent.slice(i)).length;
		var added = v.slice(i);
		textSent = v;
		if ((removed || added) && window.bspguyTextTyped)
			window.bspguyTextTyped(removed, added);
		if (!textComposing && (v.length < TEXT_INPUT_BASE.length || v.length > 200))
			resetTextInput();
	}
	textInput.addEventListener('input', sendTextInput);
	// The field keeps what's typed in it, as the keyboard expects: Firefox's Android keyboard sends a
	// keypress for each letter, and if that's cancelled (as the listener further down does for the rest
	// of the page) the letter never reaches the field, and the keyboard's backspace finds nothing it typed
	// to delete. Stopping the keypress doesn't work either: then Firefox doesn't type it in the field. So
	// the keypress goes on as usual, but GLFW is shown no character in it, and the letter reaches the
	// player through the input event instead.
	window.addEventListener('keypress', function(e) {
		if (e.target === textInput)
			Object.defineProperty(e, 'charCode', { get: function() { return 0; } });
	}, true);
	textInput.addEventListener('compositionstart', function() { textComposing = true; });
	textInput.addEventListener('compositionend', function() { textComposing = false; sendTextInput(); });
	function focusTextInput() {
		resetTextInput();
		textInput.focus();
	}
	// A quick tap can end before the player has drawn a frame with the finger there, so a tap on the line
	// of the field being edited counts too, and a field that starts being edited just after a tap is
	// focused then (the browser still counts it as the tap's doing for a few seconds).
	var textLineY = 0, textLineH = 0, lastTouchEnd = 0;
	window.addEventListener('touchend', function(e) {
		if (e.target !== canvas)
			return;
		lastTouchEnd = performance.now();
		if (!textWanted || document.activeElement === textInput)
			return;
		var y = e.changedTouches.length ? e.changedTouches[0].clientY : -1e9;
		var onLine = y >= textLineY - textLineH * 0.3 && y <= textLineY + textLineH * 1.3;
		if (textHover || onLine)
			focusTextInput();
	}, true);
	// called by the player when the text field it's editing changes (DemoGui::updateWebTextInput)
	var textField = 0;
	window.bspguyTextInputState = function(want, field, hover, password, x, y, h) {
		var started = want && field !== textField;
		textWanted = !!want;
		textField = field;
		textHover = !!hover;
		textLineY = y;
		textLineH = h;
		var type = password ? 'password' : 'text';
		if (textInput.type !== type)
			textInput.type = type;
		textInput.style.left = Math.max(0, Math.min(x, window.innerWidth - 1)) + 'px';
		textInput.style.top = Math.max(0, Math.min(y, window.innerHeight - h)) + 'px';
		textInput.style.height = Math.max(h, 1) + 'px';
		if (!want && document.activeElement === textInput) {
			textInput.blur(); // hides the keyboard
			canvas.focus();
		}
		else if (started && hover && performance.now() - lastTouchEnd < 1000) {
			if (document.activeElement === textInput)
				resetTextInput(); // another field, which the keyboard's word in progress isn't in
			else
				focusTextInput();
		}
	};

	// The build's version, which web/deploy.cmake writes into the site's copy (a hash of bspguy.wasm).
	// Both files are loaded with it, so a browser never pairs a cached bspguy.js with a newer
	// bspguy.wasm, or the other way round ("imported Memory with incompatible maximum size").
	var build = '1713238d4bb7';
	var buildQuery = build.charAt(0) === '@' ? '' : '?v=' + build;

	// The player's memory: a WebAssembly.Memory of a fixed 128 MB (-sINITIAL_MEMORY in CMakeLists.txt,
	// without growth, and -sIMPORTED_MEMORY), which is reserved and committed when it's made. A 32-bit browser's
	// tab has only 2-4 GB of address space in all, and after a restart (location.reload) the last
	// session's memory stays reserved until the browser gets round to freeing it, so asking for another
	// right away fails with "out of memory". This page makes it before loading bspguy.js, waiting and
	// trying again while the old one is freed, and bspguy.js's own request gets this one.
	var PAGE = 65536;
	var MEMORY_PAGES = 128 * 1024 * 1024 / PAGE;
	var MEMORY_WAIT_MS = 60000; // the old memory took ~16 s to be freed on a slow 32-bit laptop
	var playerMemory = null;
	var MemoryClass = window.WebAssembly && WebAssembly.Memory;
	if (MemoryClass) {
		WebAssembly.Memory = function(desc) {
			if (desc && playerMemory) {
				var mem = playerMemory;
				playerMemory = null;
				if (desc.initial === MEMORY_PAGES && desc.maximum === MEMORY_PAGES)
					return mem;
				console.warn('The build asks for a different memory size than index.html made (' + desc.initial
					+ ' pages, maximum ' + desc.maximum + '). Update MEMORY_PAGES.');
			}
			return new MemoryClass(desc);
		};
		WebAssembly.Memory.prototype = MemoryClass.prototype;
	}

	// calls done() once playerMemory is made, or with an error message if it can't be
	function reserveMemory(done) {
		if (!MemoryClass)
			return done(); // the player reports what's missing
		var started = Date.now();
		function attempt() {
			try {
				playerMemory = new MemoryClass({ initial: MEMORY_PAGES, maximum: MEMORY_PAGES });
				if (Date.now() - started > 100)
					console.log('Got the player\'s memory after waiting ' + ((Date.now() - started) / 1000).toFixed(1) + 's');
				return done();
			} catch (e) {}
			if (Date.now() - started >= MEMORY_WAIT_MS)
				return done('There isn\'t enough memory for the player. Close other tabs, or restart the browser.');
			statusEl.textContent = 'Waiting for memory...';
			setTimeout(attempt, 500);
		}
		attempt();
	}

	var Module = {
		canvas: canvas,
		locateFile: function(path, prefix) { return prefix + path + buildQuery; },
		bspguyConfig: config,
		print: function(text) { console.log(text); },
		printErr: function(text) { console.warn(text); },
		setStatus: function(text) { statusEl.textContent = text; },
		onRuntimeInitialized: function() { statusEl.textContent = ''; canvas.focus(); },
		onAbort: function(what) { statusEl.textContent = 'The player crashed: ' + what; },
	};

	// The player used to need a cross-origin isolated page for its threads, which coi-sw.js (a service
	// worker) made it by adding headers. It has no threads now, so a worker a browser still has from then
	// is removed. Only that one: the website around the player may have its own.
	if ('serviceWorker' in navigator) {
		navigator.serviceWorker.getRegistrations().then(function(regs) {
			regs.forEach(function(reg) {
				var w = reg.active || reg.waiting || reg.installing;
				if (w && /\/coi-sw\.js$/.test(new URL(w.scriptURL).pathname))
					reg.unregister();
			});
		}).catch(function() {});
	}

	// "Delete everything" in the settings' Storage tab reloads the page with this set, so the files are
	// deleted before the player opens any of them: everything in the origin private file system (the asset
	// packs and swap files) except the swap folders of other pages that are open (they hold a Web Lock
	// named after theirs), and with 'settings', the saved settings too. "Reset settings" sets
	// 'reset-settings', which deletes only the saved settings, except the Connect dialog's saved servers
	// (the stream_favorite lines of bspguy.cfg).
	function clearStorage(done) {
		var what = null;
		try {
			what = sessionStorage.getItem('bspguy-clear-storage');
			sessionStorage.removeItem('bspguy-clear-storage');
		} catch (e) {}
		if (!what)
			return done();
		if (what === 'settings' || what === 'reset-settings') {
			try {
				var servers = '';
				if (what === 'reset-settings') {
					servers = (localStorage.getItem('bspguy:bspguy.cfg') || '').split('\n').filter(function(line) {
						return line.indexOf('stream_favorite=') === 0;
					}).map(function(line) { return line + '\n'; }).join('');
				}
				var keys = [];
				for (var i = 0; i < localStorage.length; i++) {
					if (localStorage.key(i).indexOf('bspguy:') === 0)
						keys.push(localStorage.key(i));
				}
				keys.forEach(function(k) { localStorage.removeItem(k); });
				if (servers) // without any, the player starts with the default servers
					localStorage.setItem('bspguy:bspguy.cfg', servers);
			} catch (e) {}
		}
		if (what === 'reset-settings')
			return done();
		statusEl.textContent = 'Deleting stored files...';
		if (what === 'settings') {
			try { indexedDB.deleteDatabase('bspguy-local'); } catch (e) {} // the local game folder
		}
		var open = {};
		var locks = navigator.locks ? navigator.locks.query().then(function(state) {
			state.held.forEach(function(l) { open[l.name] = 1; });
		}).catch(function() {}) : Promise.resolve();
		function removeAll(dir, path) {
			var keys = dir.keys();
			function next() {
				return keys.next().then(function(r) {
					if (r.done)
						return;
					var name = r.value;
					if (path === 'bspguy-swap/') {
						if (open['bspguy-swap-' + name])
							return next(); // another open page's
					} else if (path === '' && name === 'bspguy-swap') {
						return dir.getDirectoryHandle(name).then(function(h) { return removeAll(h, 'bspguy-swap/'); })
							.catch(function() {}).then(next);
					}
					return dir.removeEntry(name, { recursive: true }).catch(function(e) {
						console.warn('Couldn\'t delete ' + path + name + ': ' + e);
					}).then(next);
				});
			}
			return next();
		}
		var opfs = navigator.storage && navigator.storage.getDirectory ? navigator.storage.getDirectory() : null;
		if (!opfs)
			return done();
		locks.then(function() { return opfs; })
			.then(function(root) { return removeAll(root, ''); })
			.catch(function(e) { console.warn('Couldn\'t delete the stored files: ' + e); })
			.then(function() { done(); });
	}

	clearStorage(function() { reserveMemory(function(error) {
		if (error) {
			statusEl.textContent = error;
			return;
		}
		statusEl.textContent = '';
		var script = document.createElement('script');
		script.src = 'bspguy.js' + buildQuery;
		document.body.appendChild(script);
	}); });
</script>
</body>
</html>
