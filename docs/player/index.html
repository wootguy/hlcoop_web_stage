<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bspguy demo player</title>
<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
	canvas { display: block; position: absolute; left: 0; top: 0; outline: none; }
	#status {
		position: absolute; left: 0; right: 0; top: 45%; text-align: center;
		font: 16px sans-serif; color: #ccc; white-space: pre-line; pointer-events: none;
	}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading...</div>
<script>
	// Options (query string):
	//   server=host:port  address shown in the Connect dialog
	//   connect=1         connect to `server` right away instead of showing the Connect dialog. If
	//                     this page has a "token" cookie (from logging in to the hlcoop_web site),
	//                     it's sent in place of the stream password.
	//   direct=1          connect to the game server directly instead of through web/serve.py.
	//                     Assets then come from https://host/<path> (the fastdl server, which must
	//                     allow this page's origin with CORS) and the stream from wss://host:port,
	//                     which needs a WebSocket relay in front of the HLTV port.
	//   potato=1          for slow computers: draw nothing until every download has finished, render
	//                     at 50% scale at most, and default to WebGL 1 (the web app's "Potato spectator")
	//   skip=world,...    turn parts of playback off for measuring, like the Debug window: world, brushes,
	//                     models, sprites, effects, dlights, audio
	//   glcache=0         send every GL call to the browser, without skipping the ones that wouldn't
	//                     change anything (for checking if that causes a rendering problem)
	//   stream=url       with direct=1: a WebSocket relay for the stream of `server` (only that
	//                     address), such as wss://host:3000/hltv from the hlcoop_webserver plugin.
	var params = new URLSearchParams(location.search);
	var config = {};
	if (params.get('server'))
		config.server = params.get('server');
	if (params.get('connect'))
		config.connect = params.get('connect');
	if (params.get('potato'))
		config.potato = params.get('potato');
	if (params.get('glcache'))
		config.glcache = params.get('glcache');
	if (params.get('skip'))
		config.skip = params.get('skip');
	var token = document.cookie.match(/(?:^|; )token=([^;]*)/);
	if (token && token[1] && token[1] !== 'DELETED')
		config.token = decodeURIComponent(token[1]);
	if (params.get('direct') !== '1') {
		// web/serve.py relays the stream and proxies fastdl downloads, avoiding CORS and TLS problems
		var ws = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host;
		config.streamUrl = ws + '/stream/{host}/{port}';
		config.assetUrl = location.origin + '/fastdl/{host}/{path}';
	}
	else if (params.get('stream')) {
		config.streamRelay = params.get('stream');
	}

	// Emscripten's GLFW reads event.keyCode, which follows the keyboard layout, so on AZERTY the movement
	// keys end up scattered (W is bottom-left) and the key in W's place (Z) toggles mouse capture. Desktop
	// GLFW uses physical key positions, so do the same here: rewrite keyCode from event.code for letters
	// and digits before GLFW's listener sees it (this listener is added first). Ctrl/Cmd shortcuts keep
	// the printed letter. The key up reuses whatever its key down sent, or GLFW would see a stuck key.
	var physicalKeys = {};
	function physicalKeyCode(e) {
		var m = /^(?:Key([A-Z])|Digit([0-9]))$/.exec(e.code || '');
		return m ? (m[1] || m[2]).charCodeAt(0) : 0;
	}
	function setKeyCode(e, keyCode) {
		if (keyCode && keyCode !== e.keyCode)
			Object.defineProperty(e, 'keyCode', { get: function() { return keyCode; } });
	}
	window.addEventListener('keydown', function(e) {
		if (!(e.code in physicalKeys))
			physicalKeys[e.code] = (e.ctrlKey || e.metaKey) ? 0 : physicalKeyCode(e);
		setKeyCode(e, physicalKeys[e.code]);
	}, true);
	window.addEventListener('keyup', function(e) {
		setKeyCode(e, physicalKeys[e.code]);
		delete physicalKeys[e.code];
	}, true);
	window.addEventListener('blur', function() { physicalKeys = {}; }, true); // key ups are lost

	// Alt slows movement, so keep Alt+key presses (Alt+S, Alt+D, Alt+Left...) away from the browser's
	// menus and shortcuts, and stop a lone Alt press from focusing the menu bar. The player still sees
	// the keys. AltGr also sets ctrlKey on Windows, and is left alone so it can still type characters.
	window.addEventListener('keydown', function(e) {
		if (e.altKey && !e.ctrlKey && !e.metaKey) e.preventDefault();
	}, true);
	window.addEventListener('keyup', function(e) {
		if (e.key === 'Alt') e.preventDefault();
	});

	// Ctrl+O opens a demo file in the player (DemoViewer::openDemoDialog), not a page in the browser
	window.addEventListener('keydown', function(e) {
		if ((e.ctrlKey || e.metaKey) && e.code === 'KeyO') e.preventDefault();
	}, true);

	// Firefox opens its quick find bar when ' or / is typed (or any character, with "search for text
	// when you start typing" enabled), which takes the keys away from the chat box. The page has no
	// text fields of its own, so cancel every character press. GLFW still reads the character from
	// the same event, and Ctrl/Cmd shortcuts are left alone.
	window.addEventListener('keypress', function(e) {
		if (!e.ctrlKey && !e.metaKey) e.preventDefault();
	}, true);

	// Dragging the camera with the right mouse button can end outside the canvas, and releasing it there
	// would open the browser's context menu. The website's live view shows the player in a same-origin
	// iframe, so the drag can also end over the outer page.
	// A context menu opened by the mouse is only allowed in a window that saw the right button pressed
	// over something other than the canvas. A drag that started on the canvas, here or in the iframe,
	// never presses the button in the outer page. This doesn't depend on when the browser sends the event
	// (Firefox on Windows sends it well after the release). Menus opened from the keyboard are left alone.
	function blockDragContextMenu(win) {
		var allowNext = false;
		win.addEventListener('mousedown', function(e) {
			if (e.button === 2)
				allowNext = !(e.target && e.target.id === 'canvas');
		}, true);
		win.addEventListener('contextmenu', function(e) {
			var fromMouse = e.button === 2 && !(e.mozInputSource === 6); // 6 = MOZ_SOURCE_KEYBOARD
			if (fromMouse && !allowNext)
				e.preventDefault();
			allowNext = false;
		}, true);
	}
	blockDragContextMenu(window);
	try {
		if (window.parent !== window)
			blockDragContextMenu(window.parent);
	} catch (e) {} // embedded by another site

	var statusEl = document.getElementById('status');
	var canvas = document.getElementById('canvas');
	canvas.width = window.innerWidth;
	canvas.height = window.innerHeight;

	// The build's version, which web/deploy.cmake writes into the site's copy (a hash of bspguy.wasm).
	// Both files are loaded with it, so a browser never pairs a cached bspguy.js with a newer
	// bspguy.wasm, or the other way round ("imported Memory with incompatible maximum size").
	var build = 'de5409c955ec';
	var buildQuery = build.charAt(0) === '@' ? '' : '?v=' + build;

	// The player's memory: a shared WebAssembly.Memory whose whole maximum (1 GB in the build) is
	// reserved up front, because it has threads. A 32-bit browser's tab has only 2-4 GB of address
	// space in all, and after a restart (location.reload) the last session's memory stays reserved until
	// the browser gets round to freeing it, so asking for another right away fails with "out of memory".
	// This page reserves it before loading bspguy.js: it waits and tries again while the old one is
	// freed, and then settles for a smaller maximum. bspguy.js's own request gets this memory, since any
	// maximum up to the build's fits the module's import. Potato mode (slow PCs, often with a 32-bit
	// browser) starts lower, at 768 MB.
	var potato = config.potato === '1';
	var PAGE = 65536;
	var MEMORY_INITIAL_PAGES = 256 * 1024 * 1024 / PAGE; // -sINITIAL_MEMORY. Grown below if the build asks for more
	var memoryMaxPages = (potato ? 768 : 1024) * 1024 * 1024 / PAGE;
	var MEMORY_MIN_PAGES = 512 * 1024 * 1024 / PAGE; // smallest maximum to settle for
	var MEMORY_WAIT_MS = 15000; // how long to wait for the old memory before trying smaller ones
	var playerMemory = null;
	var MemoryClass = window.WebAssembly && WebAssembly.Memory;
	if (MemoryClass) {
		WebAssembly.Memory = function(desc) {
			if (desc && desc.shared && playerMemory) {
				var mem = playerMemory;
				playerMemory = null;
				var pages = mem.buffer.byteLength / PAGE;
				if (desc.initial > pages)
					mem.grow(desc.initial - pages);
				return mem;
			}
			return new MemoryClass(desc);
		};
		WebAssembly.Memory.prototype = MemoryClass.prototype;
	}

	// calls done() once playerMemory is reserved, or with an error message if it can't be
	function reserveMemory(done) {
		if (!MemoryClass || typeof SharedArrayBuffer === 'undefined')
			return done(); // the player reports what's missing
		var started = Date.now();
		function attempt() {
			try {
				playerMemory = new MemoryClass({ initial: MEMORY_INITIAL_PAGES, maximum: memoryMaxPages, shared: true });
				if (Date.now() - started > 100)
					console.log('Reserved ' + (memoryMaxPages * PAGE / 1048576) + ' MB of memory after waiting '
						+ ((Date.now() - started) / 1000).toFixed(1) + 's');
				return done();
			} catch (e) {}
			var waited = Date.now() - started;
			if (waited >= MEMORY_WAIT_MS) {
				if (memoryMaxPages <= MEMORY_MIN_PAGES)
					return done('There isn\'t enough memory for the player. Close other tabs, or restart the browser.');
				memoryMaxPages = Math.max(MEMORY_MIN_PAGES, memoryMaxPages - 128 * 1024 * 1024 / PAGE);
				console.log('Trying a smaller memory reservation: ' + (memoryMaxPages * PAGE / 1048576) + ' MB');
			}
			statusEl.textContent = 'Waiting for memory...';
			setTimeout(attempt, 500);
		}
		attempt();
	}

	var Module = {
		canvas: canvas,
		locateFile: function(path, prefix) { return prefix + path + buildQuery; },
		bspguyConfig: config,
		print: function(text) { console.log(text); },
		printErr: function(text) { console.warn(text); },
		setStatus: function(text) { statusEl.textContent = text; },
		onRuntimeInitialized: function() { statusEl.textContent = ''; canvas.focus(); },
		onAbort: function(what) { statusEl.textContent = 'The player crashed: ' + what; },
	};

	// Threads need SharedArrayBuffer, which browsers only allow when the page is served with the
	// Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers. serve.py sends them. On
	// hosts that can't (GitHub Pages), coi-sw.js adds them from a service worker and reloads once.
	function start() {
		reserveMemory(function(error) {
			if (error) {
				statusEl.textContent = error;
				return;
			}
			statusEl.textContent = '';
			var script = document.createElement('script');
			script.src = 'bspguy.js' + buildQuery; // threads load the same URL
			document.body.appendChild(script);
		});
	}
	if (window.crossOriginIsolated) {
		start();
	} else if ('serviceWorker' in navigator && window.isSecureContext && !sessionStorage.getItem('coi-reloaded')) {
		navigator.serviceWorker.register('coi-sw.js').then(function() {
			return navigator.serviceWorker.ready;
		}).then(function() {
			sessionStorage.setItem('coi-reloaded', '1'); // only once, in case the headers don't help
			location.reload();
		}).catch(function(e) {
			statusEl.textContent = 'This page needs cross-origin isolation, and the service worker failed: ' + e;
		});
	} else {
		statusEl.textContent = 'This page must be served with Cross-Origin-Opener-Policy: same-origin and\n'
			+ 'Cross-Origin-Embedder-Policy: require-corp headers (use web/serve.py).';
	}
</script>
</body>
</html>
