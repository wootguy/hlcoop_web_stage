<!doctype html>
<html>
<head><meta charset="utf-8"><title>Memory test</title></head>
<body style="background:#000;color:#ccc;font:14px monospace">
<pre id="out"></pre>
<script>
// Temporary test for the ION laptop: how far a shared WebAssembly.Memory can grow in this browser.
var out = document.getElementById('out');
function log(s) { console.log('memtest: ' + s); out.textContent += s + '\n'; }
var MB = 1048576, PAGE = 65536;

if (!window.crossOriginIsolated) {
	if (!sessionStorage.getItem('memtest-reloaded')) {
		navigator.serviceWorker.register('coi-sw.js').then(function() { return navigator.serviceWorker.ready; }).then(function() {
			sessionStorage.setItem('memtest-reloaded', '1');
			location.reload();
		});
	} else {
		log('not cross-origin isolated');
	}
} else {
	run();
}

function tryGrow(label, initialMB, maxMB, stepMB) {
	var mem;
	try {
		mem = new WebAssembly.Memory({ initial: initialMB * MB / PAGE, maximum: maxMB * MB / PAGE, shared: true });
	} catch (e) {
		log(label + ': create failed: ' + e);
		return null;
	}
	var size = initialMB;
	while (size + stepMB <= maxMB) {
		try {
			mem.grow(stepMB * MB / PAGE);
			size += stepMB;
		} catch (e) {
			log(label + ': grew to ' + size + ' MB, then failed: ' + e);
			return mem;
		}
	}
	log(label + ': grew to the maximum, ' + size + ' MB');
	return mem;
}

function run() {
	log('userAgent: ' + navigator.userAgent);
	// each in turn, freeing the last before the next (held in 'keep' only until the next test)
	var tests = [
		['shared 256 -> max 768', 256, 768, 16],
		['shared 256 -> max 1024', 256, 1024, 16],
		['shared 256 -> max 512', 256, 512, 16],
		['shared 512 initial, max 768', 512, 768, 16],
		['shared 16 -> max 768', 16, 768, 16],
	];
	var only = new URLSearchParams(location.search).get('t');
	var qmax = new URLSearchParams(location.search).get('max');
	if (qmax)
		tests = [['shared ' + (+(new URLSearchParams(location.search).get('init') || 256)) + ' -> max ' + qmax, +(new URLSearchParams(location.search).get('init') || 256), +qmax, 16]];
	else if (only !== null)
		tests = [tests[+only]];
	var i = 0;
	function next() {
		if (i >= tests.length) { log('done'); return; }
		var t = tests[i++];
		var keep = tryGrow(t[0], t[1], t[2], t[3]);
		keep = null;
		setTimeout(next, 3000); // time for the last one to be freed
	}
	next();
}
</script>
</body>
</html>
